<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="css/carousel.css">
</head>
<body>
    <p>좌우 화살표를 눌러보세요</p>

    <!-- 캐러셀 전체 영역 -->
    <div id="container">
        <!-- 왼쪽 화살표 <  <div>영역  -->
        <div class="arrow" id="left">&lang;</div>

        <!-- 오른쪽 화살표 >  <div>영역 -->
        <div class="arrow" id="right">&rang;</div>
    </div>

    <script>
        /* 캐러셀 전체영역  <div id="container"></div> 요소 선택 */
       const container = document.querySelector("#container");

const pics = [
    'pic-1.jpg',
    'pic-2.jpg',
    'pic-3.jpg',
    'pic-4.jpg',
    'pic-5.jpg'
];

let i = 0;

const arrows = document.querySelectorAll(".arrow");


function showPicture() {
    container.style.backgroundImage =
        `url(images/${pics[i]})`;
}


showPicture();


arrows.forEach(function(arrow) {

    arrow.addEventListener("click", function() {

        if(arrow.id === "left") {

            i--;

            if(i < 0) {
                i = pics.length - 1;
            }

        } else if(arrow.id === "right") {

            i++;

            if(i >= pics.length) {
                i = 0;
            }
        }

        showPicture();
    });

});






    </script>

    <!--
        url()이란? css에서 배경이미지나 다른 리소스를 가져올떄 사용하는 함수
                    자바스크립트에서는 CSS의 
                    backgroundImage, listStyleImage, cursor속성등에
                    주소값을 설정할때 사용됩니다.
        
        url('이미지경로');
        `url('이미지 경로')`;
        "url('이미지 경로')";
    -->

    
</body>
</html>
